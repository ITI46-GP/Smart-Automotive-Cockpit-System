<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- This QNX image ships no fonts.conf at all, so plain fontconfig falls
       back to a slow default-path search on first font touch (~19s hang,
       even with zero Text elements on screen — Qt Quick initializes the
       font database regardless). Pointing FONTCONFIG_FILE at this small,
       valid file skips that search entirely.
       When real UI fonts are deployed (S5: GaugeSpeedNumber/GaugeLabels),
       add a <dir> entry here pointing at wherever they're copied on target,
       and load them explicitly via FontLoader in QML rather than relying on
       fontconfig to discover them. -->
  <cachedir>/tmp/.fontconfig-cache</cachedir>
</fontconfig>
